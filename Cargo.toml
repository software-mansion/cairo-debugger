[package]
name = "cairo-debugger"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cairo-annotations = { git = "https://github.com/software-mansion/cairo-annotations", rev = "78735bade42b4a9cb5505a53736ed28002d9d151", features = ["cairo-lang"] }
cairo-lang-casm = "2.17.0"
cairo-lang-sierra = "2.17.0"
cairo-lang-sierra-to-casm = "2.17.0"
cairo-lang-sierra-type-size = "2.17.0"
cairo-vm = { version = "3.2.0", features = ["test_utils"] }
dap = { git = "https://github.com/software-mansion-labs/dap-rs", rev = "27542c413184732cd8cb5632c8349d605ed4fe04" }
indexmap = "2.14"
scarb-metadata = "1"
serde_json = "1"
starknet-types-core = "0.2.4"
tracing = "0.1"

[features]
dev = []
