[package]
name = "cairo-debugger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cairo-annotations = { git = "https://github.com/software-mansion/cairo-annotations", branch = "debugger-annotations-v2", features = ["cairo-lang"] }
cairo-lang-casm = { git = "https://github.com/starkware-libs/cairo", branch = "debugger-annotations-v2/semantic-mapping" }
cairo-lang-sierra = { git = "https://github.com/starkware-libs/cairo", branch = "debugger-annotations-v2/semantic-mapping" }
cairo-lang-sierra-to-casm = { git = "https://github.com/starkware-libs/cairo", branch = "debugger-annotations-v2/semantic-mapping" }
cairo-lang-sierra-type-size = { git = "https://github.com/starkware-libs/cairo", branch = "debugger-annotations-v2/semantic-mapping" }
cairo-vm = { version = "3.2.0", features = ["test_utils"] }
dap = { git = "https://github.com/software-mansion-labs/dap-rs", rev = "27542c413184732cd8cb5632c8349d605ed4fe04" }
indexmap = "2.14"
scarb-metadata = "1"
serde_json = "1"
starknet-types-core = "0.2.4"
tracing = "0.1"

[features]
dev = []
