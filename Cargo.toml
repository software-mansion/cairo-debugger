[package]
name = "cairo-debugger"
version = "0.1.0"
edition = "2024"

[dependencies]
dap = { git = "https://github.com/software-mansion-labs/dap-rs", rev = "27542c413184732cd8cb5632c8349d605ed4fe04" }
cairo-vm = { git = "https://github.com/software-mansion-labs/cairo-vm", rev = "15052622bf338a4cad1c7100a6ae374ea52520d8", features = ["test_utils"] }
cairo-annotations = { git = "https://github.com/software-mansion/cairo-annotations", rev = "796939a0b3cb57f3751835915509ef3b7093288c", features = ["cairo-lang"] }
cairo-lang-sierra = "=2.12.3"
cairo-lang-sierra-to-casm = "=2.12.3"
cairo-lang-casm = "=2.12.3"
scarb-metadata = "1"
serde_json = "1"
tracing = "0.1"
anyhow = "1.0"
starknet-types-core = "0.2.4"

[features]
dev = []
